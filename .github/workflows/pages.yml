# 单独的 GitHub Pages 软件源部署工作流：
# - build 工作流成功完成后自动触发，直接下载其打包好的签名 feed 产物并部署（无需重新编译 SDK）
# - 也可随时手动触发（留空 run_id 自动取最近一次成功的 build 产物），改首页或重试部署只需 ~20 秒
name: pages

on:
  workflow_run:
    workflows: ['build']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: '指定 build 工作流的 run ID（留空则自动使用最近一次成功的构建）'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: '${{ steps.deployment.outputs.page_url }}'
    steps:
      - uses: actions/checkout@v4
      - name: 确定要部署的 build run ID
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RID="${{ github.event.workflow_run.id }}"
          elif [ -n "${{ inputs.run_id }}" ]; then
            RID="${{ inputs.run_id }}"
          else
            RID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          [ -n "$RID" ] || { echo "找不到可用的成功 build 记录" >&2; exit 1; }
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "将从 build run $RID 下载签名软件源产物"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve.outputs.run_id }}
          pattern: 'pkg-*'
          path: pkgs
          merge-multiple: true
      - name: 组装软件源站点（feed + 公钥 + 首页）
        run: |
          [ -d pkgs/site/feed ] || { echo "该次构建没有包含签名软件源（pkgs/site/feed）" >&2; exit 1; }
          mkdir -p site/feed
          cp -r pkgs/site/feed/* site/feed/
          cp keys/* site/feed/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>luci-app-handoff 软件源</title>
            <style>
              body{font-family:system-ui,-apple-system,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}
              pre{background:#f5f6f8;padding:12px 14px;border-radius:6px;overflow-x:auto;font-size:13px}
              code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
              h2{margin-top:28px}
              a{color:#0052ab}
            </style>
          </head>
          <body>
            <h1>luci-app-handoff 签名软件源</h1>
            <p>包与架构无关（<code>all</code>），适用于所有架构的 OpenWrt / ImmortalWrt 24.10（opkg）与 25.12（apk）。</p>
            <h2>OpenWrt / ImmortalWrt 24.10（opkg）</h2>
            <pre><code>wget -qO /etc/opkg/keys/e5d081b67f327ff4 https://r1172464137.github.io/luci-app-handoff/feed/handoff-opkg.pub
          echo 'src/gz handoff https://r1172464137.github.io/luci-app-handoff/feed/24.10' &gt;&gt; /etc/opkg/customfeeds.conf
          opkg update &amp;&amp; opkg install luci-app-handoff luci-i18n-handoff-zh-cn</code></pre>
            <h2>OpenWrt / ImmortalWrt 25.12（apk）</h2>
            <pre><code>wget -qO /etc/apk/keys/handoff-apk.pem https://r1172464137.github.io/luci-app-handoff/feed/handoff-apk.pem
          echo 'https://r1172464137.github.io/luci-app-handoff/feed/25.12/packages.adb' &gt;&gt; /etc/apk/repositories.d/customfeeds.list
          apk update &amp;&amp; apk add luci-app-handoff luci-i18n-handoff-zh-cn</code></pre>
            <p>仓库主页：<a href="https://github.com/r1172464137/luci-app-handoff">r1172464137/luci-app-handoff</a></p>
          </body>
          </html>
          EOF
          find site -maxdepth 3 -ls
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
